name: test-openclaw-api-catalog
on:
  pull_request:
    paths:
      - 'apps/ai-operating-operator/adapters/api-catalog-adapter.mjs'
      - 'apps/ai-operating-operator/test-api-catalog-adapter.mjs'
      - 'apps/ai-operating-operator/executor.mjs'
      - 'apps/ai-operating-operator/adapter-registry.json'
      - 'apps/ai-operating-operator/capability-registry.json'
      - '.github/workflows/test-openclaw-api-catalog.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/ai-operating-operator/test-api-catalog-adapter.mjs
