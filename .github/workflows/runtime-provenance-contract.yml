name: runtime-provenance-contract

on:
  pull_request:
    paths:
      - "apps/easy-developer-platform/gateway.mjs"
      - "apps/easy-developer-platform/runtime-provenance.mjs"
      - "apps/easy-developer-platform/test-runtime-provenance.mjs"
      - ".github/workflows/runtime-provenance-contract.yml"
  push:
    branches: [main]
    paths:
      - "apps/easy-developer-platform/gateway.mjs"
      - "apps/easy-developer-platform/runtime-provenance.mjs"
      - "apps/easy-developer-platform/test-runtime-provenance.mjs"
      - ".github/workflows/runtime-provenance-contract.yml"

permissions:
  contents: read

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check apps/easy-developer-platform/gateway.mjs
      - run: node --check apps/easy-developer-platform/runtime-provenance.mjs
      - run: node apps/easy-developer-platform/test-runtime-provenance.mjs
      - run: git diff --check
