name: AI Operating Operator self-test
# workflow-review: operator-safe
permissions:
  contents: read
on:
  push:
    branches: [main, feat/ai-operating-operator-background-runtime]
  pull_request:
    paths:
      - 'apps/ai-operating-operator/**'
      - '.github/workflows/ai-operating-operator-self-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check apps/ai-operating-operator/operator-core.mjs
      - run: node --check apps/ai-operating-operator/elite-bridge.mjs
      - run: node --check apps/ai-operating-operator/runtime.mjs
      - run: node --check apps/ai-operating-operator/server.mjs
      - run: node --check apps/ai-operating-operator/executor.mjs
      - run: node --check apps/ai-operating-operator/run-ledger.mjs
      - run: node --check apps/ai-operating-operator/account-probes.mjs
      - run: node --check apps/ai-operating-operator/review-gate.mjs
      - run: node --check apps/ai-operating-operator/retry-policy.mjs
      - run: node --check apps/ai-operating-operator/worker.mjs
      - run: node --check apps/ai-operating-operator/adapters/cua-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/browser-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/research-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/ollama-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/workspace-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/api-catalog-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/capability-sources-adapter.mjs
      - run: node --check apps/ai-operating-operator/adapters/openapi-mcp-adapter.mjs
      - run: node --test apps/ai-operating-operator/test-operator-core.mjs
      - run: node apps/ai-operating-operator/test-capability-registry.mjs
      - run: node apps/ai-operating-operator/adapters/test-nmap-adapter.mjs
      - run: node apps/ai-operating-operator/adapters/test-github-adapter.mjs
      - run: node apps/ai-operating-operator/test-skill-router.mjs
      - run: node apps/ai-operating-operator/test-executor.mjs
      - run: node apps/ai-operating-operator/test-background-runtime.mjs
      - run: node apps/ai-operating-operator/test-continuous-runtime.mjs
      - run: node apps/ai-operating-operator/test-elite-bridge.mjs
      - run: node apps/ai-operating-operator/test-capability-fabric.mjs
      - run: node apps/ai-operating-operator/test-cua-adapter.mjs
      - run: node apps/ai-operating-operator/test-workspace-adapter.mjs
      - run: node apps/ai-operating-operator/test-api-catalog-adapter.mjs
      - run: node apps/ai-operating-operator/test-capability-sources-adapter.mjs
      - run: node apps/ai-operating-operator/test-openapi-mcp-adapter.mjs
      - run: node apps/ai-operating-operator/test-account-probes.mjs
      - run: node apps/ai-operating-operator/test-server.mjs
