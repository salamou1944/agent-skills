name: EASY Platform Supervision
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: easy-platform-supervision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Repository audit
        run: node scripts/platform-repo-audit.mjs .
      - name: Start platform runtime
        run: node apps/easy-developer-platform/server-v2-production.mjs > /tmp/easy-platform.log 2>&1 & echo $! > /tmp/easy-platform.pid
      - name: Wait for platform health
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8790/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/easy-platform.log
          exit 1
      - name: Verify runtime contract
        env:
          EASY_PLATFORM_URL: http://127.0.0.1:8790
        run: node scripts/platform-runtime-check.mjs "$EASY_PLATFORM_URL"
      - name: Verify website response
        run: |
          curl -fsS http://127.0.0.1:8790/ | grep -F "EASY Developer Platform"
      - name: Stop runtime
        if: always()
        run: |
          if [ -f /tmp/easy-platform.pid ]; then kill "$(cat /tmp/easy-platform.pid)" || true; fi
          cat /tmp/easy-platform.log || true
