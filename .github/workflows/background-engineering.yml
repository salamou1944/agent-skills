name: Background Engineering Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write
  actions: read

jobs:
  background-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run bounded background checks
        run: node .agents/background/runner.mjs

      - name: Persist state
        if: always()
        run: |
          git config user.name 'background-engineering[bot]'
          git config user.email 'background-engineering[bot]@users.noreply.github.com'
          git add .agents/background/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist background engineering state'
            git push
          fi
