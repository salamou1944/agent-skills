name: Deploy MONY website to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'apps/mony-web/**'
      - '.github/workflows/mony-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mony-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mony-web
      - id: deployment
        uses: actions/deploy-pages@v4
