name: EASY Creative Real Provider Test

on:
  push:
    branches: [main]

jobs:
  real-provider-test:
    if: contains(github.event.head_commit.message, '[creative-self-test]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deployment
        run: sleep 25
      - name: Run real Creative provider self-test
        env:
          URL: https://easy-platform-runtime-v3-production.up.railway.app/api/creative-job/self-test
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 180 "$URL")"
          echo "$body"
          node -e '
            const x = JSON.parse(process.argv[1]);
            if (x.status !== "SUCCEEDED" || x.decision !== "PASS" || x.generatedImage !== true) {
              console.error("REAL_PROVIDER_TEST_FAILED", JSON.stringify(x));
              process.exit(1);
            }
            console.log("REAL_PROVIDER_TEST_PASS", JSON.stringify(x));
          ' "$body"
