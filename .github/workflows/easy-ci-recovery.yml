name: EASY CI Recovery

on:
  workflow_run:
    workflows: ['EASY CI Governor']
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  checks: read

jobs:
  recovery:
    name: Diagnose failed CI
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect failed jobs
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,headBranch,conclusion,url,jobs > recovery.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('recovery.json'));const failed=r.jobs.filter(j=>j.conclusion!=='success').map(j=>j.name+': '+j.conclusion).join('\\n');console.log('Failed jobs:\n'+(failed||'none'))"
      - name: Open one actionable recovery issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="CI Governor failure — run $RUN_ID"
          if gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number | grep -q 'number'; then
            echo 'Recovery issue already exists; refusing to create duplicates.'
            exit 0
          fi
          {
            echo "## CI Governor failure"
            echo
            echo "The EASY CI Governor failed and the repository is not promotable until the failure is resolved."
            echo
            echo "- Run: ${{ github.event.workflow_run.html_url }}"
            echo "- SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
            echo
            echo '### Failed jobs'
            gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '.jobs[] | select(.conclusion != "success") | "- \(.name): \(.conclusion)"'
            echo
            echo '### Recovery rule'
            echo 'Reproduce the failure, identify root cause, apply the smallest safe fix, and rerun the governor on the exact new SHA. Do not bypass the gate.'
          } > recovery.md
          gh issue create --repo "$REPO" --title "$TITLE" --body-file recovery.md
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-recovery-${{ github.event.workflow_run.id }}
          path: recovery.json
          if-no-files-found: warn
