name: Leverage Lab

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - "package.json"
      - ".github/workflows/leverage-lab.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/control-plane/**"
      - "package.json"
      - ".github/workflows/leverage-lab.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run leverage lab regression suite
        run: npm run test:leverage-lab
      - name: Syntax check control-plane modules
        run: |
          node --check apps/control-plane/frontier-engine.mjs
          node --check apps/control-plane/evidence-graph.mjs
      - name: Git diff check
        run: git diff --check
