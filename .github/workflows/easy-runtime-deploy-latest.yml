name: Deploy EASY Runtime Current

on:
  push:
    branches: [main]
    paths:
      - "apps/easy-developer-platform/**"
      - "apps/army14-evolution-lab/**"
      - "apps/control-plane/**"
      - "apps/revenue-engine/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/easy-runtime-deploy-latest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy exact checked-out source to existing Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_TOKEN"
          railway up --service easy-runtime-current --project 4c4c8630-b755-401b-a3e0-42fdd70b7bb2 --environment production --ci --detach

      - name: Record deployed source
        run: echo "GitHub source commit: $GITHUB_SHA"

# Provenance gate: deploy only the exact GitHub main commit checked out by this run.
# Trigger marker: 2026-09-22 — force registration/execution after repository secret setup.
