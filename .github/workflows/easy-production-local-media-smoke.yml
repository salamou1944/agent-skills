name: EASY production local media smoke

on:
  push:
    branches: [main]

jobs:
  production-local-media:
    if: startsWith(github.event.head_commit.message, 'test: run EASY production local media smoke')
    runs-on: ubuntu-latest
    steps:
      - name: POST real local media request
        run: |
          python - <<'PY'
          import base64, json, urllib.request
          url = "https://easy-runtime-current-production.up.railway.app/api/creative/local-media"
          png = base64.b64encode(bytes.fromhex("89504e470d0a1a0a0000000d4948445200000001000000010804000000b51c0c020000000b4944415478da6364f80f00010101013918e3670000000049454e44ae426082")).decode()
          body = json.dumps({"operation":"background_removal","dataUrl":"data:image/png;base64,"+png}).encode()
          req = urllib.request.Request(url, data=body, headers={"content-type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=180) as r:
              payload = json.loads(r.read())
              print(json.dumps({"httpStatus": r.status, "status": payload.get("status"), "evidence": payload.get("evidence")}, indent=2))
              if r.status != 200 or payload.get("status") != "LOCAL_CAPABILITY_EXECUTED":
                  raise SystemExit("production local media execution was not proven")
          PY
# production probe ready
