name: evolution-orchestrator-check
on:
  pull_request:
    paths:
      - 'apps/easy-developer-platform/evolution-orchestrator.mjs'
      - 'apps/easy-developer-platform/test-evolution-orchestrator.mjs'
      - 'apps/easy-developer-platform/evolution-manifest.schema.json'
      - 'docs/EVOLUTION-ORCHESTRATOR.md'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check apps/easy-developer-platform/evolution-orchestrator.mjs
      - run: npm run test:evolution-orchestrator
