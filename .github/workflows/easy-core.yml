name: easy-core
on:
  push:
    paths:
      - 'apps/easy/**'
      - '.github/workflows/easy-core.yml'
  pull_request:
    paths:
      - 'apps/easy/**'
      - '.github/workflows/easy-core.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check apps/easy/server.mjs
      - run: node apps/easy/test.mjs
