name: elite-code-background-supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: elite-code-background-supervisor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run one supervisor cycle
        env:
          EASY_OPERATOR_BACKGROUND: "true"
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
          EASY_OPERATOR_MAX_ATTEMPTS: "3"
          EASY_OPERATOR_INTERVAL_MS: "1000"
        run: |
          node apps/easy-developer-platform/operator-worker.mjs --once "Continue Elite Code engineering from the current repository state. Inspect the current implementation, identify the next unfinished or failing engineering step, apply only safe repository-local changes when the operator has an explicit execution path, then verify the result. Do not claim completion without evidence."

      - name: Repository verification
        run: |
          node --check apps/easy-developer-platform/operator-worker.mjs
          node --check apps/easy-developer-platform/operator-api.mjs
          node --check apps/easy-developer-platform/ai-operator.mjs
          node --check apps/easy-developer-platform/operator-state.mjs

      - name: Persist supervisor state
        run: |
          if [ -f .easy/operator-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .easy/operator-state.json
            git diff --cached --quiet || git commit -m "chore(supervisor): persist elite-code progress state"
            git push
          fi
