name: elite-code-background-supervisor

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: elite-code-background-supervisor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run autonomous Elite Code engineering cycle
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
        run: |
          copilot -p ""
          You are the autonomous Elite Code engineering worker for this repository.
          Continue the implementation from the current repository state; do not merely describe work.
          First inspect git status, recent history, the Elite Code skill, supervisor, tests, and the operating rules.
          Identify the highest-value unfinished or failing engineering step required to make Elite Code a reliable autonomous coding system.
          Then implement that step directly in the repository, run relevant tests and verification, and repair failures you introduced.
          Work only inside this checked-out repository.
          Never read, print, copy, or create secrets, credentials, private keys, tokens, or .env contents.
          Do not modify .github/workflows, repository permissions, authentication policy, or deployment configuration.
          Do not perform destructive commands, force pushes, history rewrites, external-state mutations, or dependency installation beyond the commands needed to test the existing project.
          Do not claim completion without concrete verification evidence.
          If the requested engineering step is blocked by a genuinely unavailable external dependency, make the safe repository-local improvement that removes or isolates the dependency and leave a precise evidence note.
          Finish with the repository in a tested, reviewable state; do not commit or push because the workflow will persist the verified changes itself.
          " --allow-tool='write' --allow-tool='shell(git:*)' --allow-tool='shell(node:*)' --allow-tool='shell(npm:*)' --allow-tool='shell(npx:*)' --deny-tool='shell(git push)' --deny-tool='shell(git reset)' --deny-tool='shell(git clean)' --deny-tool='write(.github/workflows)' --no-ask-user

      - name: Verify repository after autonomous cycle
        run: |
          git diff --check
          node --check apps/easy-developer-platform/operator-worker.mjs
          node --check apps/easy-developer-platform/operator-api.mjs
          node --check apps/easy-developer-platform/ai-operator.mjs
          node --check apps/easy-developer-platform/operator-state.mjs
          node --check apps/easy-developer-platform/operator-intelligence.mjs

      - name: Persist verified changes
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "chore(supervisor): continue elite-code engineering"
            git push
          fi
