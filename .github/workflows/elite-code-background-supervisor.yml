name: elite-code-background-supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: elite-monorepo-state
  cancel-in-progress: false

permissions:
  contents: write
  models: read
  copilot-requests: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install existing dependencies
        run: npm ci --ignore-scripts

      - name: Run supervisor evidence check
        continue-on-error: true
        env:
          SUPERVISOR_REPORT_PATH: /tmp/supervisor-progress.json
        run: node skills/code-progress-supervisor/scripts/check-progress.mjs

      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-code-supervisor-evidence-${{ github.run_id }}
          path: /tmp/supervisor-progress.json
          if-no-files-found: error
          retention-days: 14

      - name: Build safe fallback context
        run: |
          : > /tmp/elite-code-context.txt
          for file in \
            CORE-RULES.md \
            docs/ELITE-TASK-QUEUE.md \
            skills/elite-code-engineer/SKILL.md \
            skills/code-progress-supervisor/SKILL.md \
            apps/easy-developer-platform/autonomous-coder.mjs \
            apps/easy-developer-platform/project-queue-orchestrator.mjs \
            apps/easy-developer-platform/run-project-queue-cycle.mjs \
            package.json; do
            if [ -f "$file" ]; then
              printf '\n--- %s ---\n' "$file" >> /tmp/elite-code-context.txt
              sed -n '1,320p' "$file" >> /tmp/elite-code-context.txt
            fi
          done

      - name: Run primary Elite Code engineering cycle
        id: primary
        continue-on-error: true
        env:
          EASY_OPERATOR_LLM_API_KEY: ${{ secrets.EASY_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          EASY_OPERATOR_LLM_ENDPOINT: ${{ vars.EASY_OPERATOR_LLM_ENDPOINT || 'https://api.openai.com/v1/chat/completions' }}
          EASY_OPERATOR_LLM_MODEL: ${{ vars.EASY_OPERATOR_LLM_MODEL || 'gpt-4o-mini' }}
          EASY_OPERATOR_LLM_FALLBACK_MODEL: ${{ vars.EASY_OPERATOR_LLM_FALLBACK_MODEL || '' }}
          EASY_OPERATOR_SECONDARY_LLM_API_KEY: ${{ secrets.EASY_SECONDARY_LLM_API_KEY || '' }}
          EASY_OPERATOR_SECONDARY_LLM_ENDPOINT: ${{ vars.EASY_SECONDARY_LLM_ENDPOINT || '' }}
          EASY_OPERATOR_SECONDARY_LLM_MODEL: ${{ vars.EASY_SECONDARY_LLM_MODEL || '' }}
          EASY_OPERATOR_GITHUB_MODELS_ENDPOINT: ${{ vars.EASY_OPERATOR_GITHUB_MODELS_ENDPOINT || '' }}
          EASY_OPERATOR_GITHUB_MODELS_MODEL: ${{ vars.EASY_OPERATOR_GITHUB_MODELS_MODEL || 'openai/gpt-4o-mini' }}
          EASY_OPERATOR_PROVIDER_TIMEOUT_MS: "45000"
          EASY_OPERATOR_PROVIDER_RETRIES: "3"
          EASY_OPERATOR_RATE_LIMIT_MAX_WAIT_MS: "120000"
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/easy-developer-platform/autonomous-coder.mjs "Improve Elite Code autonomous engineering reliability using the verified repository state, tests, and rules. Do not edit workflows, secrets, deployment configuration, authentication policy, or protected paths. Make the smallest safe verified change; return VERIFIED_NOOP when no justified change exists."

      - name: Install Copilot CLI recovery
        if: steps.primary.outcome != 'success'
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Run independent Elite Code recovery
        id: recovery
        if: steps.primary.outcome != 'success'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          copilot -s --no-ask-user -p "$(cat .github/prompts/elite-code-copilot-fallback.txt /tmp/elite-code-context.txt)" > /tmp/elite-code-recovery-plan.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/elite-code-recovery-plan.json','utf8'))"
          echo 'response-file=/tmp/elite-code-recovery-plan.json' >> "$GITHUB_OUTPUT"

      - name: Apply verified recovery plan
        if: steps.primary.outcome != 'success' && steps.recovery.outcome == 'success'
        env:
          EASY_OPERATOR_PLAN_FILE: ${{ steps.recovery.outputs.response-file }}
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
          EASY_OPERATOR_PROVIDER_TIMEOUT_MS: "45000"
          EASY_OPERATOR_RATE_LIMIT_MAX_WAIT_MS: "120000"
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/easy-developer-platform/autonomous-coder.mjs "Apply the verified recovery plan for the Elite Code engineering cycle."

      - name: Run Elite Code contract tests
        if: steps.primary.outcome == 'success' || steps.recovery.outcome == 'success'
        run: |
          npm run test:elite
          node --test apps/easy-developer-platform/test-elite-provider-ladder.mjs

      - name: Verify repository after autonomous cycle
        if: steps.primary.outcome == 'success' || steps.recovery.outcome == 'success'
        run: |
          git diff --check
          node --check apps/easy-developer-platform/autonomous-coder.mjs
          node --check apps/easy-developer-platform/operator-worker.mjs
          node --test apps/easy-developer-platform/test-elite-provider-ladder.mjs
          npm run test:elite

      - name: Persist verified Elite Code progress
        if: steps.primary.outcome == 'success' || steps.recovery.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "chore(elite): persist verified engineering progress"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fail if no verified provider completed
        if: steps.primary.outcome != 'success' && steps.recovery.outcome != 'success'
        run: |
          echo "Elite Code did not obtain a verified engineering plan from any available provider."
          exit 1
