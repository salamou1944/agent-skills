name: elite-code-background-supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: elite-code-background-supervisor
  cancel-in-progress: false

permissions:
  contents: write
  models: read
  copilot-requests: write

jobs:
  supervise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install existing dependencies
        run: npm ci --ignore-scripts

      - name: Run supervisor evidence check
        env:
          SUPERVISOR_REPORT_PATH: /tmp/supervisor-progress.json
        run: node skills/code-progress-supervisor/scripts/check-progress.mjs

      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elite-code-supervisor-evidence-${{ github.run_id }}
          path: /tmp/supervisor-progress.json
          if-no-files-found: error
          retention-days: 14

      - name: Build safe fallback context
        run: |
          : > /tmp/elite-code-context.txt
          for file in \
            CORE-RULES.md \
            skills/elite-code-engineer/SKILL.md \
            skills/code-progress-supervisor/SKILL.md \
            apps/easy-developer-platform/autonomous-coder.mjs \
            apps/easy-developer-platform/test-elite-code-supervisor.mjs \
            package.json; do
            if [ -f "$file" ]; then
              printf '\n--- %s ---\n' "$file" >> /tmp/elite-code-context.txt
              sed -n '1,260p' "$file" >> /tmp/elite-code-context.txt
            fi
          done

      - name: Run primary Elite Code engineering cycle
        id: primary
        continue-on-error: true
        env:
          EASY_OPERATOR_LLM_API_KEY: ${{ secrets.EASY_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          EASY_OPERATOR_LLM_ENDPOINT: ${{ vars.EASY_OPERATOR_LLM_ENDPOINT || 'https://api.openai.com/v1/chat/completions' }}
          EASY_OPERATOR_LLM_MODEL: ${{ vars.EASY_OPERATOR_LLM_MODEL || 'gpt-4o-mini' }}
          EASY_OPERATOR_GITHUB_MODELS_ENDPOINT: ${{ vars.EASY_OPERATOR_GITHUB_MODELS_ENDPOINT || 'https://models.github.ai/inference' }}
          EASY_OPERATOR_GITHUB_MODELS_MODEL: ${{ vars.EASY_OPERATOR_GITHUB_MODELS_MODEL || 'openai/gpt-4o-mini' }}
          GITHUB_TOKEN: ${{ github.token }}
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
          EASY_OPERATOR_CODER_ATTEMPTS: "2"
          ELITE_CODE_PROMPT: >-
            You are the autonomous Elite Code engineering worker for this repository. Continue the implementation from the current repository state; do not merely describe work. First inspect git status, recent history, the Elite Code skill, supervisor, tests, and the operating rules. Identify the highest-value unfinished or failing engineering step required to make Elite Code a reliable autonomous coding system. If the repository already satisfies the goal, return a verified no-op instead of inventing changes. Otherwise implement that step directly in the repository, run relevant tests and verification, and repair failures you introduced. Work only inside this checked-out repository. Never read, print, copy, or create secrets, credentials, private keys, tokens, or .env contents. Do not modify .github/workflows, repository permissions, authentication policy, or deployment configuration. Do not perform destructive commands, force pushes, history rewrites, external-state mutations, or dependency installation beyond the commands needed to test the existing project. Do not claim completion without concrete verification evidence. Finish with the repository in a tested, reviewable state; do not commit or push because the workflow will persist verified changes itself.
        run: |
          test -n "$EASY_OPERATOR_LLM_API_KEY" || test -n "$GITHUB_TOKEN"
          node apps/easy-developer-platform/autonomous-coder.mjs "$ELITE_CODE_PROMPT"

      - name: Run GitHub Models fallback
        id: github_models
        if: steps.primary.outcome != 'success'
        continue-on-error: true
        uses: actions/ai-inference@v2.1.1
        with:
          prompt-file: .github/prompts/elite-code-fallback.prompt.yml
          file_input: |
            context: /tmp/elite-code-context.txt
          token: ${{ github.token }}

      - name: Install Copilot CLI recovery
        if: steps.primary.outcome != 'success' && steps.github_models.outcome != 'success'
        run: npm install -g @github/copilot

      - name: Run Copilot recovery planner
        id: copilot
        if: steps.primary.outcome != 'success' && steps.github_models.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat .github/prompts/elite-code-copilot-fallback.txt /tmp/elite-code-context.txt > /tmp/elite-code-copilot-prompt.txt
          copilot -p "$(cat /tmp/elite-code-copilot-prompt.txt)" -s --no-ask-user --model gpt-4.1 > /tmp/copilot-plan.json

      - name: Apply verified GitHub Models fallback plan
        if: steps.primary.outcome != 'success' && steps.github_models.outcome == 'success'
        env:
          EASY_OPERATOR_PLAN_FILE: ${{ steps.github_models.outputs.response-file }}
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
        run: node apps/easy-developer-platform/autonomous-coder.mjs "Apply the verified fallback plan"

      - name: Apply verified Copilot recovery plan
        if: steps.primary.outcome != 'success' && steps.github_models.outcome != 'success' && steps.copilot.outcome == 'success'
        env:
          EASY_OPERATOR_PLAN_FILE: /tmp/copilot-plan.json
          EASY_OPERATOR_WORKSPACE: ${{ github.workspace }}
        run: node apps/easy-developer-platform/autonomous-coder.mjs "Apply the verified Copilot recovery plan"

      - name: Run Elite Code contract tests
        if: steps.primary.outcome == 'success' || steps.github_models.outcome == 'success' || steps.copilot.outcome == 'success'
        run: npm run test:elite

      - name: Verify repository after autonomous cycle
        if: steps.primary.outcome == 'success' || steps.github_models.outcome == 'success' || steps.copilot.outcome == 'success'
        run: |
          git diff --check
          node --check apps/easy-developer-platform/operator-worker.mjs
          node --check apps/easy-developer-platform/operator-api.mjs
          node --check apps/easy-developer-platform/ai-operator.mjs
          node --check apps/easy-developer-platform/operator-state.mjs
          node --check apps/easy-developer-platform/operator-intelligence.mjs
          node --check apps/easy-developer-platform/autonomous-coder.mjs
          node --check skills/code-progress-supervisor/scripts/check-progress.mjs

      - name: Persist verified changes
        if: steps.primary.outcome == 'success' || steps.github_models.outcome == 'success' || steps.copilot.outcome == 'success'
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "chore(supervisor): continue elite-code engineering"
            git push
          fi

      - name: Fail if no verified provider completed
        if: steps.primary.outcome != 'success' && steps.github_models.outcome != 'success' && steps.copilot.outcome != 'success'
        run: |
          echo "No autonomous provider completed successfully. Primary, GitHub Models, and Copilot recovery all failed."
          exit 1
