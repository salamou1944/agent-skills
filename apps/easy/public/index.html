<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASY Creative</title><style>body{font-family:system-ui;margin:0;background:#080b12;color:#f4f7fb}main{max-width:760px;margin:auto;padding:24px}section{background:#111722;border:1px solid #263044;border-radius:18px;padding:20px;margin:16px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #344057;background:#0b1019;color:inherit}button{cursor:pointer;font-weight:700}.ok{padding:12px;border-radius:10px;background:#14251d}.bad{padding:12px;border-radius:10px;background:#32171b}small{opacity:.7}</style></head><body><main><h1>EASY</h1><p>Creative Engine foundation — product identity first.</p><section><h2>1. Product DNA</h2><input id="name" placeholder="Product name"><input id="color" placeholder="Color"><input id="logo" placeholder="Logo / brand"><input id="printedText" placeholder="Printed text"><input id="brandName" placeholder="Brand name"><input id="shape" placeholder="Shape / proportions"><input id="components" placeholder="Visible components"><input id="designDetails" placeholder="Design details"><button onclick="build()">Build Product DNA</button><div id="status"></div></section><section><h2>2. Creative brief</h2><textarea id="prefs" rows="5" placeholder="Background, lighting, camera, composition, context..."></textarea><button onclick="plan()">Prepare Creative</button><pre id="out"></pre></section><small>External image/video generation is intentionally disabled until a provider is selected and the integrity contract passes.</small></main><script>let dna=null;const $=id=>document.getElementById(id);async function post(p,b){const r=await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});return r.json()}async function build(){const x={productName:$('name').value,color:$('color').value,logo:$('logo').value,printedText:$('printedText').value,brandName:$('brandName').value,shape:$('shape').value,components:$('components').value,designDetails:$('designDetails').value};const r=await post('/api/product-dna',x);dna=r.dna;$('status').className=r.ready?'ok':'bad';$('status').textContent=r.ready?'Product DNA ready.':'Blocked: complete every identity field.'}async function plan(){if(!dna)return $('out').textContent='Build Product DNA first.';const r=await post('/api/creative/plan',{dna,preferences:{brief:$('prefs').value}});$('out').textContent=JSON.stringify(r,null,2)}</script></body></html>
