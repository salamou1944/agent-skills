<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASY Developer Platform</title><style>body{margin:0;background:#080b12;color:#eef2ff;font:14px system-ui}*{box-sizing:border-box}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:24px;background:#0d111a;border-right:1px solid #202638}.brand{font-size:22px;font-weight:800;margin-bottom:30px}.nav{display:grid;gap:7px}.nav button{background:none;border:0;color:#9aa5bd;text-align:left;padding:11px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#171d2b;color:white}.main{padding:28px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:7px 10px;border:1px solid #2a344a;border-radius:999px;color:#8ff0bd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.card{background:#101520;border:1px solid #20283a;border-radius:14px;padding:18px}.big{font-size:26px;font-weight:750;margin-top:8px}.muted{color:#8994aa}.section{margin-top:22px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #1d2433}.btn{background:#eef2ff;color:#090c13;border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.terminal{background:#06080d;border:1px solid #20283a;border-radius:12px;padding:16px;font-family:ui-monospace,monospace;color:#b9f6d0;min-height:150px;white-space:pre-wrap}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.main{padding:18px}}</style></head><body><div class="app"><aside class="side"><div class="brand">EASY<span class="muted"> / Dev</span></div><div class="nav"><button class="active">Overview</button><button>Projects</button><button>Agent</button><button>Skills</button><button>APIs</button><button>Tools</button><button>GitHub</button><button>Code Guardian</button><button>Tests</button><button>Preview</button></div></aside><main class="main"><div class="top"><div><h1>EASY Developer Platform</h1><div class="muted">v0.1 — build, verify and ship from one control plane</div></div><div class="badge">● System online</div></div><div class="grid"><div class="card"><div class="muted">Projects</div><div class="big" id="projects">—</div></div><div class="card"><div class="muted">Self-test</div><div class="big" id="tests">Not run</div></div><div class="card"><div class="muted">Architecture</div><div class="big">Provider-neutral</div></div></div><div class="section card"><div class="top"><h2>Control plane</h2><button class="btn" onclick="runTest()">Run self-test</button></div><div id="modules"></div></div><div class="section card"><h2>Activity</h2><div id="events" class="terminal">Loading…</div></div></main></div><script>async function get(p){return fetch(p).then(r=>r.json())}async function refresh(){const [p,m,e,c]=await Promise.all([get('/api/projects'),get('/api/platform'),get('/api/events'),get('/api/checks')]);projects.textContent=p.projects.length;modules.innerHTML=m.modules.map(x=>`<div class="row"><span>${x}</span><span class="muted">ready for v0.1</span></div>`).join('');events.textContent=e.events.length?e.events.map(x=>`[${new Date(x.at).toLocaleTimeString()}] ${x.kind}: ${x.message}`).join('\n'):'No events yet';if(c.checks[0])tests.textContent=c.checks[0].status}async function runTest(){tests.textContent='Running…';await fetch('/api/checks/run',{method:'POST'});refresh()}refresh();setInterval(refresh,5000)</script></body></html>
