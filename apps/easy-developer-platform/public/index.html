<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASY Developer Platform</title><style>body{margin:0;background:#080b12;color:#eef2ff;font:14px system-ui}*{box-sizing:border-box}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:24px;background:#0d111a;border-right:1px solid #202638}.brand{font-size:22px;font-weight:800;margin-bottom:30px}.nav{display:grid;gap:7px}.nav button{background:none;border:0;color:#9aa5bd;text-align:left;padding:11px;border-radius:9px}.nav button.active,.nav button:hover{background:#171d2b;color:white}.main{padding:28px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:7px 10px;border:1px solid #2a344a;border-radius:999px;color:#8ff0bd}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:22px}.card{background:#101520;border:1px solid #20283a;border-radius:14px;padding:18px}.big{font-size:24px;font-weight:750;margin-top:8px}.muted{color:#8994aa}.section{margin-top:22px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #1d2433}.btn{background:#eef2ff;color:#090c13;border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.input{background:#090d15;border:1px solid #293247;color:white;border-radius:9px;padding:10px;width:100%;margin:8px 0}.terminal{background:#06080d;border:1px solid #20283a;border-radius:12px;padding:16px;font-family:ui-monospace,monospace;color:#b9f6d0;min-height:150px;white-space:pre-wrap}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr 1fr}.main{padding:18px}}</style></head><body><div class="app"><aside class="side"><div class="brand">EASY<span class="muted"> / Dev</span></div><div class="nav"><button class="active">Overview</button><button>Projects</button><button>Workspace</button><button>Agent</button><button>Builds</button><button>Skills</button><button>APIs</button><button>Tools</button><button>GitHub</button><button>Code Guardian</button><button>Tests</button><button>Preview</button><button>Deploy</button></div></aside><main class="main"><div class="top"><div><h1>EASY Developer Platform</h1><div class="muted">EASY Group · control plane v0.5.1</div></div><div class="badge">● System online</div></div><div class="grid"><div class="card"><div class="muted">Projects</div><div class="big" id="projects">—</div></div><div class="card"><div class="muted">Agent tasks</div><div class="big" id="tasks">—</div></div><div class="card"><div class="muted">Builds</div><div class="big" id="builds">—</div></div><div class="card"><div class="muted">Self-test</div><div class="big" id="tests">Not run</div></div><div class="card"><div class="muted">Runtime</div><div class="big" id="runtime">Checking</div></div></div><div class="section card"><h2>Provider readiness</h2><div id="providers"></div></div><div class="section card"><div class="top"><h2>Projects</h2><button class="btn" onclick="newProject()">Create project</button></div><input class="input" id="projectName" placeholder="Project name"><div id="projectList"></div></div><div class="section card"><div class="top"><h2>Build pipeline</h2><button class="btn" onclick="queueBuild()">Queue build</button></div><div id="buildList" class="terminal">No builds yet</div></div><div class="section card"><h2>Agent</h2><input class="input" id="prompt" placeholder="Describe a task for the agent"><button class="btn" onclick="queueTask()">Queue task</button><div id="taskList"></div></div><div class="section card"><div class="top"><h2>Verification</h2><button class="btn" onclick="runTest()">Run self-test</button></div><div id="modules"></div></div><div class="section card"><h2>Activity</h2><div id="events" class="terminal">Loading…</div></div></main></div><script>const get=p=>fetch(p).then(r=>r.json());async function refresh(){const[p,m,e,c,t,r,b]=await Promise.all([get('/api/projects'),get('/api/platform'),get('/api/events'),get('/api/checks'),get('/api/agent/tasks'),get('/api/runtime'),get('/api/builds')]);projects.textContent=p.projects.length;tasks.textContent=t.tasks.length;builds.textContent=b.builds.length;runtime.textContent=r.executionReady?'Ready':'Provider gated';providers.innerHTML=[['Agent execution',r.executionReady,r.agentProvider],['GitHub integration',r.githubReady,r.githubProvider],['Deployment',r.deployReady,r.deployProvider]].map(x=>`<div class="row"><span>${x[0]}</span><span class="muted">${x[1]?'ready · '+x[2]:'not configured'}</span></div>`).join('');modules.innerHTML=m.modules.map(x=>`<div class="row"><span>${x}</span><span class="muted">boundary active</span></div>`).join('');projectList.innerHTML=p.projects.map(x=>`<div class="row"><span>${x.name}</span><span class="muted">${x.status} · ${x.branch}</span></div>`).join('');taskList.innerHTML=t.tasks.slice(0,5).map(x=>`<div class="row"><span>${x.prompt}</span><span class="muted">${x.status}</span></div>`).join('');buildList.textContent=b.builds.length?b.builds.slice(0,8).map(x=>`${x.id.slice(0,8)}  ${x.projectId}  ${x.status}`).join('\n'):'No builds yet';events.textContent=e.events.length?e.events.map(x=>`[${new Date(x.at).toLocaleTimeString()}] ${x.kind}: ${x.message}`).join('\n'):'No events yet';if(c.checks[0])tests.textContent=c.checks[0].status}async function newProject(){const name=projectName.value.trim();if(!name)return;await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});projectName.value='';refresh()}async function queueTask(){const prompt=document.getElementById('prompt').value.trim();if(!prompt)return;await fetch('/api/agent/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({project:'easy-core',prompt})});document.getElementById('prompt').value='';refresh()}async function queueBuild(){await fetch('/api/builds',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({project:'easy-core',purpose:'EASY build'})});refresh()}async function runTest(){tests.textContent='Running…';await fetch('/api/tests/run',{method:'POST'});refresh()}refresh();setInterval(refresh,5000)</script></body></html>
